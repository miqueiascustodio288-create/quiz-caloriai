[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/analytics"
  to = "/analytics.html"
  status = 200

[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200

[[redirects]]
  from = "/api/funnel"
  to = "/.netlify/functions/funnel"
  status = 200

[[redirects]]
  from = "/api/analytics/export"
  to = "/.netlify/functions/export"
  status = 200

[[redirects]]
  from = "/api/analytics"
  to = "/.netlify/functions/analytics"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
